<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>CPCOMPANY</title>
<style>
  @font-face { font-family: "Pretendard"; src: url("lib/PretendardVariable.woff2") format("woff2-variations"), url("lib/PretendardVariable.woff2") format("woff2"); font-weight: 45 920; font-display: swap; }
  /* 공식 웹사이트 문법: 흰 바탕, 검정 글자, 작은 대문자 라벨, 각진 검정 버튼, 회색 제품 사진 패널 */
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #767676;
    --panel: #e0e0e0;      /* 렌즈 제품 사진 배경 */
    --line: #dcdcdc;
    --cam-fg: #ffffff;
    --rec: #c8492c;
    --font: "Pretendard", -apple-system, "Apple SD Gothic Neo", sans-serif;
    --top: env(safe-area-inset-top, 0px);
    --bottom: env(safe-area-inset-bottom, 0px);
    --gl: max(18px, env(safe-area-inset-left, 0px));
    --gr: max(18px, env(safe-area-inset-right, 0px));
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; background: #000; }
  /* 비디오는 캔버스에 그려서 보여줌 (사진·영상에 같이 담기도록) */
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; pointer-events: none; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .label { font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
  button {
    font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    border: 1px solid var(--fg); border-radius: 0; padding: 15px 28px;
    background: var(--fg); color: var(--bg); cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  button:disabled { opacity: .45; cursor: wait; }
  .outline { background: transparent; color: var(--fg); }

  .langs { display: flex; gap: 14px; }
  .langs button, .seg button, .modes button {
    background: transparent; border: 0; padding: 4px 0; color: var(--muted); border-bottom: 1px solid transparent; letter-spacing: .14em; font-size: 11px;
  }
  .langs button[aria-pressed="true"], .seg button[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--fg); }
  .seg { display: flex; gap: 18px; justify-content: center; }

  /* ---------- 첫 화면 ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 5; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: grid; grid-template-rows: auto 1fr auto; gap: 22px;
    padding: calc(16px + var(--top)) var(--gr) calc(18px + var(--bottom)) var(--gl);
  }
  #intro header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  #intro header img { height: 30px; width: auto; display: block; }
  #intro main { display: grid; align-content: center; justify-items: center; text-align: center; gap: 0; max-width: 460px; width: 100%; margin: 0 auto; }
  .panel { width: 100%; background: var(--panel); aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; margin-bottom: 26px; }
  #introChips { display: flex; gap: 8px; }
  #introChips canvas { width: 54px; height: 54px; }
  #intro h1 { font-size: clamp(22px, 6vw, 30px); font-weight: 600; margin: 0 0 12px; letter-spacing: -0.01em; text-wrap: balance; }
  #intro .desc { color: #3a3a3a; margin: 0 0 8px; font-size: 14px; line-height: 1.7; word-break: keep-all; text-wrap: balance; }
  #intro .hint { color: var(--muted); margin: 0 0 24px; font-size: 12.5px; line-height: 1.7; word-break: keep-all; text-wrap: balance; }
  .pick { display: grid; justify-items: center; gap: 10px; margin-bottom: 24px; }
  .pick .label { color: var(--muted); }
  #start { min-width: 220px; }
  #msg { margin-top: 14px; color: var(--muted); font-size: 12.5px; min-height: 1.4em; }
  #intro footer { padding-top: 14px; border-top: 1px solid var(--line); text-align: center; display: grid; gap: 6px; justify-items: center; }
  .note { font-size: 10.5px; line-height: 1.65; color: var(--muted); max-width: 420px; text-wrap: balance; word-break: keep-all; margin: 0; }

  /* ---------- 촬영 화면 (카메라 위라 흰 글자) ---------- */
  #topbar {
    position: fixed; left: 0; right: 0; top: 0; z-index: 3; color: var(--cam-fg);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(14px + var(--top)) var(--gr) 22px var(--gl);
    background: linear-gradient(rgba(0,0,0,.42), rgba(0,0,0,0));
  }
  #topbar img { height: 26px; width: auto; display: block; }
  .brand { display: flex; align-items: center; gap: 10px; }
  #home { background: transparent; border: 0; padding: 6px 4px; color: #fff !important; display: grid; place-items: center; margin-left: -4px; }
  .toptools { display: flex; gap: 16px; align-items: center; }
  #topbar button { color: rgba(255,255,255,.62); }
  #topbar button[aria-pressed="true"] { color: #fff; border-bottom-color: #fff; }
  #flip { background: transparent; border: 1px solid rgba(255,255,255,.6); color: #fff !important; padding: 7px 10px; font-size: 10.5px; }
  #controls {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; color: var(--cam-fg);
    display: grid; justify-items: center; gap: 16px;
    padding: 30px var(--gr) calc(12px + var(--bottom)) var(--gl);
    background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.6));
  }
  .modes { display: flex; gap: 24px; }
  .modes button { color: rgba(255,255,255,.62); }
  .modes button[aria-pressed="true"] { color: #fff; border-bottom-color: #fff; }
  .row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; max-width: 420px; }
  #shutter {
    width: 70px; height: 70px; border-radius: 50%; padding: 0; grid-column: 2;
    background: transparent; border: 1.5px solid #fff; display: grid; place-items: center;
  }
  #shutter::after { content: ""; width: 56px; height: 56px; border-radius: 50%; background: #fff; transition: all .2s ease; }
  #shutter.video::after { background: var(--rec); }
  #shutter.recording::after { width: 24px; height: 24px; border-radius: 2px; background: var(--rec); }
  #recTime { justify-self: start; font-variant-numeric: tabular-nums; font-weight: 500; font-size: 13px; letter-spacing: .1em; }
  #recTime::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--rec); margin-right: 8px; vertical-align: 2px; }
  #controls .note { color: rgba(255,255,255,.66); font-size: 10px; text-align: center; }

  /* ---------- 촬영 결과 ---------- */
  #review {
    position: fixed; inset: 0; z-index: 6; background: var(--bg);
    display: grid; grid-template-rows: 1fr auto; gap: 18px;
    padding: calc(16px + var(--top)) var(--gr) calc(18px + var(--bottom)) var(--gl);
  }
  #preview { min-height: 0; display: grid; place-items: center; background: var(--panel); }
  #preview img, #preview video { max-width: 100%; max-height: 100%; display: block; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #saveHint { text-align: center; font-size: 12px; color: var(--muted); margin: 10px 0 0; min-height: 1.2em; word-break: keep-all; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; transition: opacity .25s ease; }
  @media (prefers-reduced-motion: reduce) { #shutter::after, #flash { transition: none; } }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>
</div>
<div id="flash"></div>

<div id="topbar" hidden>
  <div class="brand">
    <button id="home" type="button" aria-label="Home"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <img src="logo-white.png" alt="C.P. Company">
  </div>
  <div class="toptools">
    <div class="seg" role="group" aria-label="Material">
      <button type="button" data-mat="lens" aria-pressed="true">Lens</button>
      <button type="button" data-mat="dyed" aria-pressed="false">Dyed</button>
    </div>
    <button id="flip" type="button" data-i18n="flip">Flip</button>
  </div>
</div>

<div id="controls" hidden>
  <div class="modes" role="group">
    <button type="button" id="modePhoto" aria-pressed="true" data-i18n="photo">사진</button>
    <button type="button" id="modeVideo" aria-pressed="false" data-i18n="video">영상</button>
  </div>
  <div class="row">
    <span id="recTime" hidden>0:00</span>
    <button id="shutter" type="button" aria-label="Shutter"></button>
    <span></span>
  </div>
  <p class="note" data-i18n="note"></p>
</div>

<div id="intro">
  <header>
    <img src="logo-black.png" alt="C.P. Company">
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="ko" aria-pressed="true">KO</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="it" aria-pressed="false">IT</button>
    </div>
  </header>
  <main>
    <div class="panel"><div id="introChips" aria-hidden="true"></div></div>
    <h1 data-i18n="title"></h1>
    <p class="desc" data-i18n="desc"></p>
    <p class="hint" data-i18n="hint"></p>
    <div class="pick">
      <span class="label" data-i18n="material"></span>
      <div class="seg" role="group">
        <button type="button" data-mat="lens" aria-pressed="true">Lens</button>
        <button type="button" data-mat="dyed" aria-pressed="false">Garment Dyed</button>
      </div>
    </div>
    <button id="start" type="button" data-i18n="start"></button>
    <div id="msg"></div>
  </main>
  <footer>
    <span class="label">996—026 · Memories of Italian Sportswear in South Korea</span>
    <p class="note" data-i18n="note"></p>
  </footer>
</div>

<div id="review" hidden>
  <div id="preview"></div>
  <div>
    <div class="actions">
      <button id="save" type="button" data-i18n="save"></button>
      <button id="retake" class="outline" type="button" data-i18n="retake"></button>
    </div>
    <p id="saveHint"></p>
  </div>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker, ImageSegmenter } from "./lib/vision_bundle.mjs";

// ---------- 언어 ----------
const I18N = {
  ko: {
    title: "손끝의 CP컴퍼니",
    desc: "손바닥을 펴서 카메라에 보여주세요.<br>다섯 손끝에 한 글자씩 따라다닙니다.",

    material: "소재", start: "카메라 켜기", flip: "전환", photo: "사진", video: "영상",

    noRec: "이 브라우저에서는 영상 녹화를 지원하지 않아요.",
    shareHint: "공유 메뉴에서 '이미지 저장' 또는 '비디오 저장'을 누르면 사진 앱에 저장돼요.",
    downloaded: "다운로드 폴더에 저장했어요.",
  },
  en: {
    title: "CP컴퍼니 at your fingertips",
    desc: "Show your open hand to the camera.<br>Each fingertip carries one letter of “CP컴퍼니”, the way C.P. Company is written in Korean.",
    hint: "Make a V sign for C and P only. Close your hand into a fist, then open it fast for fireworks behind you.",
    material: "Material", start: "Turn on camera", flip: "Flip", photo: "Photo", video: "Video",
    save: "Save", retake: "Retake",
    note: 'To celebrate 30 years in Korea, C.P. Company and its long-time partner G.F. Fashion present the special exhibition "996-026. Memories of Italian Sportswear in South Korea".',
    camOn: "Turning on the camera…", loading: "Loading hand tracking…",
    denied: "Camera access was denied. Allow it in Settings > Safari > Camera.",
    failed: "Couldn't start. Check your connection and camera, then try again.",
    noRec: "This browser can't record video.",
    shareHint: "Tap 'Save Image' or 'Save Video' in the share sheet to keep it in Photos.",
    downloaded: "Saved to your Downloads folder.",
  },
  it: {
    title: "CP컴퍼니 sulla punta delle dita",
    desc: "Mostra la mano aperta alla fotocamera.<br>Su ogni polpastrello compare una lettera di “CP컴퍼니”, il nome C.P. Company scritto in coreano.",
    hint: "Fai il segno della V per vedere solo C e P. Chiudi la mano a pugno e riaprila di scatto per i fuochi d'artificio alle tue spalle.",
    material: "Materiale", start: "Attiva la fotocamera", flip: "Gira", photo: "Foto", video: "Video",
    save: "Salva", retake: "Rifai",
    note: 'Per celebrare i 30 anni in Corea, C.P. Company e lo storico partner G.F. Fashion presentano la mostra speciale "996-026. Memories of Italian Sportswear in South Korea".',
    camOn: "Attivazione della fotocamera…", loading: "Caricamento del riconoscimento della mano…",
    denied: "Accesso alla fotocamera negato. Consentilo in Impostazioni > Safari > Fotocamera.",
    failed: "Impossibile avviare. Controlla la connessione e la fotocamera, poi riprova.",
    noRec: "Questo browser non può registrare video.",
    shareHint: "Tocca 'Salva immagine' o 'Salva video' nel menu di condivisione per tenerlo in Foto.",
    downloaded: "Salvato nella cartella Download.",
  },
};
let lang = "ko";
try { const s = localStorage.getItem("cp-lang"); if (I18N[s]) lang = s; } catch {}
const t = (k) => I18N[lang][k];
function applyLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  try { localStorage.setItem("cp-lang", l); } catch {}
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));
applyLang(lang);

// ---------- 기본 설정 ----------
const LETTERS = ["C", "P", "컴", "퍼", "니"];   // 화면 왼쪽부터 이 순서
const TIPS = [4, 8, 12, 16, 20];              // MediaPipe 손끝 랜드마크: 엄지 → 새끼
// 글자별 원단 (C.P. Company 재킷 사진 확대): 그린 나일론, 올리브 다운, 버건디, 세이지 립스탑, 브라운 아라미드
const DYES = ["#6f8a7a", "#5b5a44", "#6e2328", "#b9bba8", "#5a4a34"];
const $ = (id) => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
const startBtn = $("start"), msg = $("msg"), shutter = $("shutter"), recTime = $("recTime");

let landmarker = null, segmenter = null, stream = null, facing = "user";
let lastVideoTime = -1, results = [];
let mode = "photo", recorder = null, recChunks = [], recStart = 0, recTimer = null;
let captured = null; // { blob, type: "photo"|"video", name }
let material = "lens";
let shooting = false; // 저장되는 프레임에만 워터마크
const smooth = new Map();
let W = 0, H = 0, DPR = 1;
const frame = document.createElement("canvas"); // 렌즈 굴절용 프레임 복사본
const fctx = frame.getContext("2d");
const person = document.createElement("canvas"); // 불꽃놀이 앞에 다시 그릴 사람
const pctx = person.getContext("2d");
const maskCv = document.createElement("canvas");
const mctx = maskCv.getContext("2d");
let maskReady = false;

const logoWhite = new Image();
logoWhite.src = "logo-white.png";

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = frame.width = person.width = Math.round(W * DPR);
  canvas.height = frame.height = person.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  pctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize);
resize();

// ---------- 가먼트 다잉 원단 텍스처 ----------
function rand(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function makeDyed(color, seed) {
  const S = 256, c = document.createElement("canvas");
  c.width = c.height = S;
  const g = c.getContext("2d"), rnd = rand(seed);
  g.fillStyle = color; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 26; i++) {
    const x = rnd() * S, y = rnd() * S, rr = 20 + rnd() * 90, light = rnd() > 0.5;
    const grd = g.createRadialGradient(x, y, 0, x, y, rr);
    grd.addColorStop(0, light ? `rgba(255,248,230,${0.05 + rnd() * 0.09})` : `rgba(0,0,0,${0.06 + rnd() * 0.12})`);
    grd.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = grd; g.fillRect(0, 0, S, S);
  }
  for (let y = 0; y < S; y += 2) { g.fillStyle = `rgba(0,0,0,${0.03 + rnd() * 0.05})`; g.fillRect(0, y, S, 1); }
  for (let x = 0; x < S; x += 3) { g.fillStyle = `rgba(255,255,255,${0.015 + rnd() * 0.03})`; g.fillRect(x, 0, 1, S); }
  const id = g.getImageData(0, 0, S, S), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - 0.5) * 18; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(id, 0, 0);
  const edge = g.createRadialGradient(S / 2, S / 2, S * 0.28, S / 2, S / 2, S * 0.5);
  edge.addColorStop(0, "rgba(0,0,0,0)"); edge.addColorStop(1, "rgba(0,0,0,.38)");
  g.fillStyle = edge; g.fillRect(0, 0, S, S);
  return c;
}
const DYED_TEX = DYES.map((c, i) => makeDyed(c, 1234 + i * 7919)); // 사진을 불러오기 전 임시 텍스처
const FABRICS = DYES.map((_, i) => {
  const img = new Image();
  img.onload = () => { DYED_TEX[i] = img; renderIntroChips(); };
  img.src = `lib/fabric-${i}.jpg`;
  return img;
});

// ---------- 동그라미 ----------
function letterFont(r, letter, weight) {
  return `${weight} ${Math.round(r * (/[A-Z]/.test(letter) ? 1.0 : 0.88))}px "Pretendard", -apple-system, sans-serif`;
}

// 원을 따라 글자 쓰기 (렌즈 테두리 안쪽의 C.P. / COMPANY 인쇄)
function arcText(c, text, x, y, radius, center, top, size) {
  c.save();
  c.font = `500 ${size}px "Pretendard", -apple-system, sans-serif`;
  c.textAlign = "center"; c.textBaseline = "middle";
  const spacing = size * 0.12;
  const widths = [...text].map(ch => c.measureText(ch).width + spacing);
  const total = widths.reduce((a, b) => a + b, 0);
  const dir = top ? 1 : -1;
  let a = center - dir * (total / radius) / 2;
  [...text].forEach((ch, i) => {
    const step = widths[i] / radius;
    const mid = a + dir * step / 2;
    c.save();
    c.translate(x + Math.cos(mid) * radius, y + Math.sin(mid) * radius);
    c.rotate(mid + dir * Math.PI / 2);
    c.fillText(ch, 0, 0);
    c.restore();
    a += dir * step;
  });
  c.restore();
}

// 고글 렌즈: 무광 검정 테, 짙은 유리, 오른쪽 위 은은한 반사, 안쪽 C.P. / COMPANY 인쇄
function drawLens(c, x, y, r, letter, src) {
  c.save();
  c.shadowColor = "rgba(0,0,0,.35)"; c.shadowBlur = r * 0.5; c.shadowOffsetY = r * 0.12;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = "#0d0d0d"; c.fill();
  c.restore();

  const rim = c.createLinearGradient(x, y - r, x, y + r);
  rim.addColorStop(0, "#2a2a2a"); rim.addColorStop(0.5, "#121212"); rim.addColorStop(1, "#050505");
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = rim; c.fill();

  const gr = r * 0.82;
  c.save();
  c.beginPath(); c.arc(x, y, gr, 0, Math.PI * 2); c.clip();
  c.fillStyle = "#070707"; c.fillRect(x - r, y - r, r * 2, r * 2);
  if (src) {
    const z = 1.5, sr = gr / z;
    c.globalAlpha = 0.22;
    c.drawImage(src, (x - sr) * DPR, (y - sr) * DPR, sr * 2 * DPR, sr * 2 * DPR, x - gr, y - gr, gr * 2, gr * 2);
    c.globalAlpha = 1;
  }
  const hl = c.createRadialGradient(x + gr * 0.45, y - gr * 0.2, 0, x + gr * 0.45, y - gr * 0.2, gr * 0.75);
  hl.addColorStop(0, "rgba(255,255,255,.16)"); hl.addColorStop(1, "rgba(255,255,255,0)");
  c.fillStyle = hl; c.fillRect(x - r, y - r, r * 2, r * 2);
  c.restore();
  c.lineWidth = Math.max(0.6, r * 0.025); c.strokeStyle = "rgba(255,255,255,.08)";
  c.beginPath(); c.arc(x, y, gr, 0, Math.PI * 2); c.stroke();

  if (r >= 17) {
    c.fillStyle = "rgba(255,255,255,.88)";
    const s = r * 0.17;
    arcText(c, "C.P.", x, y, gr * 0.8, -Math.PI / 2, true, s);
    arcText(c, "COMPANY", x, y, gr * 0.8, Math.PI / 2, false, s);
  }

  c.save();
  c.font = letterFont(r * 0.82, letter, 500);
  c.textAlign = "center"; c.textBaseline = "middle";
  c.fillStyle = "#ffffff";
  c.fillText(letter, x, y + r * 0.03);
  c.restore();
}

function drawDyed(c, x, y, r, letter, f) {
  c.save();
  c.shadowColor = "rgba(0,0,0,.35)"; c.shadowBlur = r * 0.5; c.shadowOffsetY = r * 0.12;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = DYES[f]; c.fill();
  c.restore();
  c.save();
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.clip();
  c.drawImage(DYED_TEX[f], x - r, y - r, r * 2, r * 2);
  // 가장자리로 갈수록 살짝 어둡게 (원단 단추처럼 둥글게 보이도록)
  const edge = c.createRadialGradient(x - r * 0.25, y - r * 0.3, r * 0.2, x, y, r);
  edge.addColorStop(0, "rgba(255,255,255,.06)"); edge.addColorStop(0.7, "rgba(0,0,0,0)"); edge.addColorStop(1, "rgba(0,0,0,.32)");
  c.fillStyle = edge; c.fillRect(x - r, y - r, r * 2, r * 2);
  c.restore();
  c.save();
  c.setLineDash([r * 0.12, r * 0.09]);
  c.lineWidth = Math.max(1, r * 0.045);
  c.strokeStyle = "rgba(235,228,210,.55)";
  c.beginPath(); c.arc(x, y, r * 0.84, 0, Math.PI * 2); c.stroke();
  c.restore();
  c.save();
  c.font = letterFont(r * 1.1, letter, 700);
  c.textAlign = "center"; c.textBaseline = "middle";
  c.fillStyle = "rgba(0,0,0,.35)";
  c.fillText(letter, x, y + r * 0.04 + Math.max(1, r * 0.035));
  c.shadowColor = "rgba(0,0,0,.45)"; c.shadowBlur = r * 0.14;
  c.fillStyle = "#ffffff";
  c.fillText(letter, x, y + r * 0.04);
  c.restore();
}

// f = 글자 번호 (C=0 … 니=4)
function drawChip(c, x, y, r, f, src) {
  if (material === "lens") drawLens(c, x, y, r, LETTERS[f], src);

// ---------- 좌표 ----------
function geometry() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(W / vw, H / vh);
  const dw = vw * scale, dh = vh * scale;
  return { dw, dh, ox: (W - dw) / 2, oy: (H - dh) / 2 };
}
function toScreen(p, g) {
  const nx = facing === "user" ? 1 - p.x : p.x;
  return { x: g.ox + nx * g.dw, y: g.oy + p.y * g.dh };
}
function drawCover(c, img, g) {
  c.save();
  if (facing === "user") { c.translate(W, 0); c.scale(-1, 1); }
  c.drawImage(img, g.ox, g.oy, g.dw, g.dh);
  c.restore();
}

// ---------- 제스처 ----------
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const FINGERS = [[8, 6], [12, 10], [16, 14], [20, 18]]; // 검지~새끼 [끝, 둘째마디]
function fingerState(pt) {
  const w = pt[0];
  const ext = FINGERS.map(([tip, pip]) => dist(w, pt[tip]) > dist(w, pt[pip]) * 1.18);
  const fold = FINGERS.map(([tip, pip]) => dist(w, pt[tip]) < dist(w, pt[pip]) * 1.02);
  const palm = dist(pt[5], pt[17]);
  const thumbOut = dist(pt[4], pt[17]) > dist(pt[3], pt[17]) * 1.05 && dist(pt[4], pt[5]) > palm * 0.55;
  return {
    open: ext.every(Boolean) && thumbOut,
    fist: fold.every(Boolean),
    v: ext[0] && ext[1] && fold[2] && fold[3],
  };
}

// 손가락(0=엄지…4=새끼) → 글자 번호. 왼손·오른손, 전면·후면 상관없이 손끝을 위로 봤을 때 왼쪽부터 C P 컴 퍼 니
// (손이 기울어져도 손바닥 문구와 같은 방향 기준으로 읽히도록 손 방향의 오른쪽 벡터로 비교)
function letterMap(pts, s) {
  const ux = pts[9].x - pts[0].x, uy = pts[9].y - pts[0].y; // 손목 → 가운데손가락 뿌리 (위쪽)
  const rx = -uy, ry = ux;                                  // 화면에서 손 기준 오른쪽
  const rightOf = (a, b) => (pts[a].x - pts[b].x) * rx + (pts[a].y - pts[b].y) * ry > 0;
  if (s.v) {
    // 브이: 검지·중지 중 왼쪽이 C, 오른쪽이 P
    return rightOf(8, 12) ? [[1, 1], [2, 0]] : [[1, 0], [2, 1]];
  }
  const thumbRight = rightOf(4, 20); // 엄지가 새끼보다 오른쪽이면 순서를 뒤집음
  return [0, 1, 2, 3, 4].map(f => [f, thumbRight ? 4 - f : f]);
}

// ---------- 손바닥 문구 ----------
const palmAlpha = new Map();
function drawPalmText(pt, alpha) {
  const cx = (pt[0].x + pt[5].x + pt[9].x + pt[13].x + pt[17].x) / 5;
  const cy = (pt[0].y + pt[5].y + pt[9].y + pt[13].y + pt[17].y) / 5;
  const palmW = dist(pt[5], pt[17]);
  const ang = Math.atan2(pt[9].y - pt[0].y, pt[9].x - pt[0].x) + Math.PI / 2;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy);
  ctx.rotate(ang);
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
  ctx.font = '800 100px "Pretendard", -apple-system, sans-serif';
  const big = Math.max(10, 100 * (palmW * 1.05) / ctx.measureText("IN KOREA").width);
  const small = big / 5;
  const lh = big * 0.96;
  const top = -(lh * 2 + small * 1.4) / 2;
  ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = big * 0.12; ctx.shadowOffsetY = big * 0.03;
  ctx.fillStyle = "#ffffff";
  ctx.font = `800 ${big}px "Pretendard", -apple-system, sans-serif`;
  ctx.fillText("30 YEARS", 0, top + big * 0.82);
  ctx.fillText("IN KOREA", 0, top + lh + big * 0.82);
  ctx.font = `500 ${small}px "Pretendard", -apple-system, sans-serif`;
  if ("letterSpacing" in ctx) ctx.letterSpacing = `${small * 0.08}px`;
  ctx.fillText("with GF Fashion", 0, top + lh * 2 + small * 1.25);
  ctx.restore();
}

// ---------- 불꽃놀이 ----------
const COLORS = ["#ffffff", "#f3e7c9", "#e0b25a", "#c8492c", "#b8c6d4"];
let particles = [], pendingBursts = [], lastFire = 0;
const fistAt = new Map();
function fireworks(now) {
  if (now - lastFire < 1800) return;
  lastFire = now;
  for (let i = 0; i < 6; i++) pendingBursts.push(now + i * 260 + Math.random() * 120);
  pendingBursts.sort((a, b) => a - b);
}
function burst() {
  const x = W * (0.12 + Math.random() * 0.76), y = H * (0.1 + Math.random() * 0.35);
  const color = COLORS[(Math.random() * COLORS.length) | 0];
  const n = 70 + ((Math.random() * 40) | 0), sp = Math.min(W, H) / 400;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.2, v = (1.6 + Math.random() * 3.2) * sp;
    particles.push({ x, y, px: x, py: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: 0.010 + Math.random() * 0.012, color, size: (1.2 + Math.random() * 1.6) * Math.max(1, sp * 0.8) });
  }
  particles.push({ x, y, px: x, py: y, vx: 0, vy: 0, life: 1, decay: 0.08, color: "#ffffff", size: 26 * sp, flash: true });
}
function updateFireworks(now) {
  while (pendingBursts.length && pendingBursts[0] <= now) { pendingBursts.shift(); burst(); }
  if (!particles.length) return;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round";
  const g = Math.min(W, H) / 400 * 0.045;
  particles = particles.filter(p => {
    p.px = p.x; p.py = p.y;
    p.vx *= 0.985; p.vy = p.vy * 0.985 + g;
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) return false;
    ctx.globalAlpha = Math.min(1, p.life * 1.4);
    if (p.flash) {
      const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
      grd.addColorStop(0, "rgba(255,255,255,.9)"); grd.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grd; ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
    } else {
      ctx.strokeStyle = p.color; ctx.lineWidth = p.size;
      ctx.beginPath(); ctx.moveTo(p.px - p.vx * 2, p.py - p.vy * 2); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
    return true;
  });
  ctx.restore();
}
const fireworksActive = () => particles.length > 0 || pendingBursts.length > 0;

// 인물 마스크 → 사람만 다시 그려서 불꽃이 뒤로 가게
function updateMask() {
  if (!segmenter) return;
  segmenter.segmentForVideo(video, performance.now(), (res) => {
    const m = res.confidenceMasks && res.confidenceMasks[0];
    if (!m) return;
    const mw = m.width, mh = m.height, data = m.getAsFloat32Array();
    if (maskCv.width !== mw || maskCv.height !== mh) { maskCv.width = mw; maskCv.height = mh; }
    const img = mctx.createImageData(mw, mh), d = img.data;
    for (let i = 0; i < data.length; i++) {
      d[i * 4 + 3] = Math.min(1, Math.max(0, (data[i] - 0.35) / 0.4)) * 255;
    }
    mctx.putImageData(img, 0, 0);
    maskReady = true;
  });
}
function drawPerson(g) {
  if (!maskReady) return;
  pctx.save();
  pctx.globalCompositeOperation = "source-over";
  pctx.clearRect(0, 0, W, H);
  drawCover(pctx, video, g);
  pctx.globalCompositeOperation = "destination-in";
  drawCover(pctx, maskCv, g);
  pctx.restore();
  ctx.drawImage(person, 0, 0, W, H);
}

// ---------- 워터마크 ----------
function drawWatermark() {
  const pad = 18;
  ctx.save();
  ctx.globalAlpha = 0.9;
  if (logoWhite.naturalWidth) {
    const h = 30, w = logoWhite.naturalWidth * (h / logoWhite.naturalHeight);
    ctx.drawImage(logoWhite, pad, H - pad - h - 12, w, h);
  }
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  if ("letterSpacing" in ctx) ctx.letterSpacing = "1.5px";
  ctx.font = '500 8.5px "Pretendard", -apple-system, sans-serif';
  ctx.fillText("996—026 · 30 YEARS IN KOREA", pad, H - pad);
  ctx.restore();
}

// ---------- 메인 루프 ----------
function loop() {
  const now = performance.now();
  if (video.readyState >= 2 && video.videoWidth) {
    const newFrame = video.currentTime !== lastVideoTime;
    if (newFrame) {
      lastVideoTime = video.currentTime;
      results = landmarker.detectForVideo(video, now).landmarks || [];
    }
    const g = geometry();
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    drawCover(ctx, video, g);

    const hands = results.map(hand => hand.map(q => toScreen(q, g)));
    const states = hands.map(fingerState);
    // 주먹 → 0.7초 안에 쫙 펴면 불꽃놀이
    states.forEach((s, h) => {
      if (s.fist) fistAt.set(h, now);
      else if (s.open && now - (fistAt.get(h) || 0) < 700) { fistAt.delete(h); fireworks(now); }
    });

    if (fireworksActive()) {
      if (newFrame) updateMask();
      updateFireworks(now);
      drawPerson(g);
    } else maskReady = false;

    if (material === "lens" && hands.length) fctx.drawImage(canvas, 0, 0);
    const seen = new Set();
    hands.forEach((pts, h) => {
      const s = states[h];
      const r = Math.max(11, Math.min(40, dist(pts[0], pts[9]) * 0.19));
      const a0 = palmAlpha.get(h) || 0;
      const a = a0 + ((s.open ? 1 : 0) - a0) * 0.18;
      palmAlpha.set(h, a);
      if (a > 0.02) drawPalmText(pts, a);
      letterMap(pts, s).forEach(([finger, li]) => {
        const p = pts[TIPS[finger]];
        const key = h + "-" + finger;
        seen.add(key);
        const o = smooth.get(key);
        const cur = o ? { x: o.x + (p.x - o.x) * 0.55, y: o.y + (p.y - o.y) * 0.55, r: o.r + (r - o.r) * 0.3 } : { x: p.x, y: p.y, r };
        smooth.set(key, cur);
        drawChip(ctx, cur.x, cur.y, cur.r, li, frame);
      });
    });
    for (const key of smooth.keys()) if (!seen.has(key)) smooth.delete(key);
    for (const h of palmAlpha.keys()) if (h >= hands.length) palmAlpha.delete(h);
    if (shooting) drawWatermark();
  }
  if (running) requestAnimationFrame(loop);
}

// ---------- 촬영 ----------
function setMode(m) {
  if (recorder) return;
  mode = m;
  $("modePhoto").setAttribute("aria-pressed", m === "photo");
  $("modeVideo").setAttribute("aria-pressed", m === "video");
  shutter.classList.toggle("video", m === "video");
}
$("modePhoto").addEventListener("click", () => setMode("photo"));
$("modeVideo").addEventListener("click", () => setMode("video"));

const stamp = () => {
  const d = new Date(), z = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;
};

shutter.addEventListener("click", () => {
  if (mode === "photo") takePhoto();
  else if (recorder) stopRecording();
  else startRecording();
});

function takePhoto() {
  shooting = true;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    canvas.toBlob((blob) => {
      shooting = false;
      if (!blob) return;
      flash();
      showReview({ blob, type: "photo", name: `CPCOMPANY-${stamp()}.jpg` });
    }, "image/jpeg", 0.92);
  }));
}

function flash() {
  const f = $("flash");
  f.style.opacity = "0.8";
  setTimeout(() => (f.style.opacity = "0"), 80);
}

function pickMime() {
  const list = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  return list.find(x => window.MediaRecorder && MediaRecorder.isTypeSupported(x)) || "";
}

function startRecording() {
  if (!window.MediaRecorder || !canvas.captureStream) { alert(t("noRec")); return; }
  const mime = pickMime();
  const out = canvas.captureStream(30);
  try {
    recorder = new MediaRecorder(out, mime ? { mimeType: mime, videoBitsPerSecond: 6_000_000 } : undefined);
  } catch {
    recorder = new MediaRecorder(out);
  }
  recChunks = [];
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop = () => {
    const type = recorder.mimeType || mime || "video/webm";
    const blob = new Blob(recChunks, { type });
    const ext = type.includes("mp4") ? "mp4" : "webm";
    recorder = null; shooting = false;
    clearInterval(recTimer);
    recTime.hidden = true;
    shutter.classList.remove("recording");
    out.getTracks().forEach(x => x.stop());
    showReview({ blob, type: "video", name: `CPCOMPANY-${stamp()}.${ext}` });
  };
  shooting = true;
  recorder.start(250);
  recStart = Date.now();
  recTime.textContent = "0:00";
  recTime.hidden = false;
  shutter.classList.add("recording");
  recTimer = setInterval(() => {
    const s = Math.floor((Date.now() - recStart) / 1000);
    recTime.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    if (s >= 60) stopRecording(); // 최대 1분
  }, 250);
}

function stopRecording() {
  if (recorder && recorder.state !== "inactive") recorder.stop();
}

function showReview(item) {
  captured = item;
  const url = URL.createObjectURL(item.blob);
  const el = item.type === "photo" ? new Image() : document.createElement("video");
  el.src = url;
  if (item.type === "video") { el.controls = true; el.playsInline = true; el.loop = true; el.muted = true; el.autoplay = true; }
  $("preview").replaceChildren(el);
  $("saveHint").textContent = "";
  $("review").hidden = false;
}

$("retake").addEventListener("click", () => {
  const el = $("preview").firstChild;
  if (el && el.src) URL.revokeObjectURL(el.src);
  $("preview").replaceChildren();
  captured = null;
  $("review").hidden = true;
});

$("save").addEventListener("click", async () => {
  if (!captured) return;
  const file = new File([captured.blob], captured.name, { type: captured.blob.type });
  // 아이폰: 공유 시트에서 "이미지 저장"/"비디오 저장"으로 사진 앱에 저장
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      $("saveHint").textContent = t("shareHint");
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file);
  a.download = captured.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  $("saveHint").textContent = t("downloaded");
});
</script>
</body>
</html>
