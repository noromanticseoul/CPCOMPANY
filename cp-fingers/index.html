<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CPCOMPANY</title>
<style>
  @font-face { font-family: "Pretendard"; src: url("lib/PretendardVariable.woff2") format("woff2-variations"), url("lib/PretendardVariable.woff2") format("woff2"); font-weight: 45 920; font-display: swap; }
  :root {
    --bg: #0d0f10;
    --fg: #f4f5f2;
    --muted: #9aa09b;
    --chip: #ffffff;
    --ink: #111312;
    --font: "Pretendard", -apple-system, "Apple SD Gothic Neo", sans-serif;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #intro {
    position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
    background: var(--bg); padding: 24px; z-index: 5;
  }
  #intro h1 { font-size: clamp(36px, 9vw, 72px); font-weight: 900; margin: 0 0 8px; letter-spacing: -0.02em; }
  #intro p { color: var(--muted); margin: 0 0 28px; font-size: 15px; line-height: 1.6; }
  .dots { display: flex; gap: 10px; justify-content: center; margin-bottom: 28px; }
  .dots span {
    width: 52px; height: 52px; border-radius: 50%; background: var(--chip); color: var(--ink);
    display: grid; place-items: center; font-weight: 900; font-size: 22px;
  }
  button {
    font: inherit; font-weight: 700; font-size: 17px; border: 0; border-radius: 999px;
    padding: 14px 32px; background: var(--fg); color: var(--ink); cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--muted); outline-offset: 3px; }
  button:disabled { opacity: .5; cursor: wait; }
  #msg { margin-top: 18px; color: var(--muted); font-size: 14px; min-height: 1.4em; }
  #flip {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 4; padding: 10px 18px; font-size: 14px; background: rgba(255,255,255,.85);
  }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>
<button id="flip" hidden>카메라 전환</button>

<div id="intro">
  <div>
    <div class="dots"><span>C</span><span>P</span><span>컴</span><span>퍼</span><span>니</span></div>
    <h1>CP컴퍼니</h1>
    <p>카메라에 손바닥을 펴서 보여주세요.<br>엄지부터 새끼손가락까지 한 글자씩 따라다닙니다.</p>
    <button id="start">카메라 켜기</button>
    <div id="msg"></div>
  </div>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from "./lib/vision_bundle.mjs";

const LETTERS = ["C", "P", "컴", "퍼", "니"];   // 엄지 → 새끼
const TIPS = [4, 8, 12, 16, 20];              // MediaPipe 손끝 랜드마크
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const startBtn = document.getElementById("start");
const flipBtn = document.getElementById("flip");
const msg = document.getElementById("msg");

let landmarker = null;
let stream = null;
let facing = "user";
let lastVideoTime = -1;
let results = [];
const smooth = new Map(); // "hand-finger" -> {x, y, r}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);
resize();

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
}

async function loadModel() {
  const files = await FilesetResolver.forVisionTasks(new URL("./lib/wasm", location.href).href);
  const opts = (delegate) => ({
    baseOptions: {
      modelAssetPath: new URL("./lib/hand_landmarker.task", location.href).href,
      delegate,
    },
    runningMode: "VIDEO",
    numHands: 2,
  });
  // 사파리는 GPU 모드에서 멈추는 경우가 있어 CPU로 실행
  return await withTimeout(HandLandmarker.createFromOptions(files, opts("CPU")), 60000);
}

async function openCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false,
  });
  video.srcObject = stream;
  video.style.transform = facing === "user" ? "scaleX(-1)" : "none";
  await video.play();
}

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  try {
    msg.textContent = "카메라를 켜는 중…";
    await openCamera();
    msg.textContent = "손 인식 모델을 불러오는 중…";
    landmarker = await loadModel();
    await document.fonts.load('900 40px "Pretendard"').catch(() => {});
    document.getElementById("intro").hidden = true;
    flipBtn.hidden = false;
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    startBtn.disabled = false;
    msg.textContent = e && e.name === "NotAllowedError"
      ? "카메라 권한이 거부됐어요. 주소창의 카메라 아이콘에서 허용해 주세요."
      : "시작하지 못했어요. 인터넷 연결과 카메라를 확인해 주세요.";
  }
});

flipBtn.addEventListener("click", async () => {
  facing = facing === "user" ? "environment" : "user";
  smooth.clear();
  try { await openCamera(); } catch { facing = "user"; await openCamera(); }
});

// 화면 좌표로 변환 (object-fit: cover + 전면 카메라 좌우반전 반영)
function toScreen(p) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(innerWidth / vw, innerHeight / vh);
  const dw = vw * scale, dh = vh * scale;
  const ox = (innerWidth - dw) / 2, oy = (innerHeight - dh) / 2;
  const nx = facing === "user" ? 1 - p.x : p.x;
  return { x: ox + nx * dw, y: oy + p.y * dh, scale: dw };
}

function drawChip(x, y, r, letter) {
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.35)";
  ctx.shadowBlur = r * 0.5;
  ctx.shadowOffsetY = r * 0.12;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = "#111312";
  ctx.font = `800 ${Math.round(r * (/[A-Z]/.test(letter) ? 1.15 : 1.0))}px "Pretendard", -apple-system, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(letter, x, y + r * 0.04);
}

function loop() {
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    results = res.landmarks || [];
  }
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  const seen = new Set();
  results.forEach((hand, h) => {
    const wrist = toScreen(hand[0]);
    const mid = toScreen(hand[9]);
    const handSize = Math.hypot(mid.x - wrist.x, mid.y - wrist.y);
    const r = Math.max(16, Math.min(60, handSize * 0.28));
    TIPS.forEach((idx, f) => {
      const p = toScreen(hand[idx]);
      const key = h + "-" + f;
      seen.add(key);
      const s = smooth.get(key);
      const k = 0.55;
      const cur = s ? { x: s.x + (p.x - s.x) * k, y: s.y + (p.y - s.y) * k, r: s.r + (r - s.r) * 0.3 } : { x: p.x, y: p.y, r };
      smooth.set(key, cur);
      drawChip(cur.x, cur.y, cur.r, LETTERS[f]);
    });
  });
  for (const key of smooth.keys()) if (!seen.has(key)) smooth.delete(key);
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
