    const s = Math.min(target.w / c.b.width, target.h / c.b.height);   // fit inside 80% box, keep ratio
    bigInner.replaceChildren(...[...faceGroups[i].childNodes].map(n => n.cloneNode(true)));
    bigInner.setAttribute('transform', `scale(${s}) translate(${-c.x} ${-c.y})`);
    bigInner.querySelectorAll('path').forEach(p => p.setAttribute('stroke-width', SW / s * 1.0));
    pop = { k:0.55, v:0, o:0 };
    faceGroups.forEach((g, j) => g.style.opacity = j === i ? '1' : '.55');
    readout.innerHTML = `현재 표정: <b>${FACES[i].label}</b>`;
  }
  function renderBig(){
    bigOuter.setAttribute('transform', `translate(${target.cx} ${target.cy}) scale(${pop.k})`);
    bigOuter.style.opacity = pop.o.toFixed(3);
  }

  // ---- springs ----
  let snapTo = null;          // target x,y when magnet is active
  let vel = { x:0, y:0 };
  let dragging = false;
  let last = performance.now();

  function tick(now){
    const dt = Math.min(0.032, (now - last) / 1000); last = now;

    // magnet snap (underdamped spring for a little overshoot)
    if (!dragging && snapTo){
      const k = 520, d = 26;
      vel.x += ((snapTo.x - pos.x) * k - vel.x * d) * dt;
      vel.y += ((snapTo.y - pos.y) * k - vel.y * d) * dt;
      pos.x += vel.x * dt; pos.y += vel.y * dt;
      if (Math.abs(snapTo.x - pos.x) < 1e-3 && Math.abs(vel.x) < 1e-2){ pos = { ...snapTo }; vel = { x:0, y:0 }; snapTo = null; }
      placeCircle();
    }

    // big-face pop (spring to scale 1)
    const kk = 300, dd = 18;
    pop.v += ((1 - pop.k) * kk - pop.v * dd) * dt;
    pop.k += pop.v * dt;
    pop.o += (1 - pop.o) * Math.min(1, dt * 14);
    renderBig();

    requestAnimationFrame(tick);
  }

  // ---- pointer ----
  const toLocal = (e) => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(sticker.getScreenCTM().inverse());
  };
  let grabOffset = 0;

  function onDown(e){
    const p = toLocal(e);
    dragging = true; snapTo = null; vel = { x:0, y:0 };
    svg.classList.add('dragging');
    svg.setPointerCapture(e.pointerId);
    // grab the circle where it is; clicking elsewhere on the bar jumps it there
    grabOffset = Math.abs(p.x - pos.x) <= CIRCLE.w/2 + .4 ? pos.x - p.x : 0;
    moveTo(p.x + grabOffset);
    e.preventDefault();
  }
  function moveTo(x){
    pos.x = Math.max(minX, Math.min(maxX, x));
    pos.y = yAt(pos.x);
    placeCircle();
    const n = nearest(pos.x);
    if (n !== active){ active = n; showFace(n); }
  }
  function onMove(e){ if (dragging) moveTo(toLocal(e).x + grabOffset); }
  function onUp(){
    if (!dragging) return;
    dragging = false; svg.classList.remove('dragging');
    active = nearest(pos.x);
    snapTo = { x: centers[active].x, y: centers[active].y };
    showFace(active);
  }
  hit.addEventListener('pointerdown', onDown);
  circleG.addEventListener('pointerdown', onDown);
  circleG.style.cursor = 'grab';
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup', onUp);
  svg.addEventListener('pointercancel', onUp);

  // keyboard
  svg.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    active = Math.max(0, Math.min(centers.length-1, active + (e.key === 'ArrowRight' ? 1 : -1)));
    snapTo = { x: centers[active].x, y: centers[active].y };
    showFace(active);
    e.preventDefault();
  });

  // ---- zoom between sticker and full bar 1 frame ----
  const VB_STICKER = [48.26, 34.5, 32, 24], VB_FULL = [0, 0, 132, 99];
  let vb = [...VB_STICKER], zoomed = true, zoomAnim = null;
  const zoomBtn = document.getElementById('zoomBtn');
  zoomBtn.addEventListener('click', () => {
    zoomed = !zoomed;
    zoomBtn.textContent = zoomed ? '전체 프레임 보기' : '스티커 확대';
    const from = [...vb], to = zoomed ? VB_STICKER : VB_FULL, t0 = performance.now(), dur = 700;
    cancelAnimationFrame(zoomAnim);
    const step = (now) => {
      const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 4);
      vb = from.map((v, i) => v + (to[i] - v) * e);
      svg.setAttribute('viewBox', vb.join(' '));
      if (t < 1) zoomAnim = requestAnimationFrame(step);
    };
    zoomAnim = requestAnimationFrame(step);
  });

  // init
  placeCircle();
  showFace(0);
  pop = { k:1, v:0, o:1 };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
